services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # bcrypt hash of the rope admin password, from /opt/website/.env (written
      # by the deploy from the ROPE_ADMIN_HASH secret; see rope/plans/playtest-recording.md).
      - ROPE_ADMIN_HASH=${ROPE_ADMIN_HASH}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - website
      - clipboard
      - pool
      - rope
      - chonk

  website:
    image: ${WEBSITE_IMAGE:-ghcr.io/karin-lu/website:latest}
    restart: unless-stopped
    environment:
      - PORT=3000

  clipboard:
    image: ${CLIPBOARD_IMAGE:-ghcr.io/karin-lu/website/clipboard:latest}
    restart: unless-stopped

  pool:
    image: ${POOL_IMAGE:-ghcr.io/karin-lu/website/pool:latest}
    restart: unless-stopped
    environment:
      - PORT=8080

  rope:
    image: ${ROPE_IMAGE:-ghcr.io/karin-lu/website/rope:latest}
    restart: unless-stopped
    environment:
      - PORT=8080
      - PLAYTEST_DIR=/data/playtests
    volumes:
      # Recorded playtest runs. A bind mount rather than a named volume so the
      # host's backup cron (deploy/host-setup.sh) can read it directly.
      - /opt/website/playtests:/data/playtests

  # Shed! 锄大猫 card game: static files + WebSocket rooms (karin-lu/chonk). Its own workflow pushes the
  # image and restarts just this service; CHONK_IMAGE defaults so this file works without it being exported.
  chonk:
    image: ${CHONK_IMAGE:-ghcr.io/karin-lu/chonk:latest}
    restart: unless-stopped
    environment:
      - PORT=8080

volumes:
  caddy_data:
  caddy_config:
