<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Berry material review</title>
<style>
body { margin:0; background:#1f2430; color:#f0f1e8; font:14px system-ui; }
canvas { display:block; width:100vw; height:100vh; }
nav { position:fixed; top:24px; left:28px; display:flex; gap:12px; align-items:center; flex-wrap:wrap; right:20px; }
button { background:#313944; color:#f0f1e8; border:1px solid #657071; padding:8px 14px; cursor:pointer; }
label { display:flex; gap:8px; align-items:center; }
p { position:fixed; bottom:22px; left:28px; color:#f0f1e8; background:#1f2430; }
</style>
<nav><button id="day">Daylight</button><button id="cave">Cave</button><button id="back">Backlight</button>
<label>Glow <input id="glow" type="range" min="0" max="3" step="0.1" value="1.5"></label>
<label>Turn <input id="turn" type="range" min="-3.14" max="3.14" step="0.01" value="0"></label><button id="front">Front</button><button id="side">Side</button><button id="above">Above</button><button id="below">Below</button></nav>
<p>Actual game geometry and materials · small, medium and large fruit · opaque stems behind the skin show transmission</p>
<script type="module">
import * as THREE from '/node_modules/three/build/three.module.js';
import { roundBerryGeometry, roundBerryKnot, roundBerryTexture, roundBerryMaterial, berryCapGeometry, berryCapMaterial, berryFullness } from '/src/render3d/roundBerry.ts';
import { berryStalkRadius, STALK_KNOT_HEIGHT } from '/src/render/starberryArt.ts';
import { Environment, configureRenderer } from '/src/render3d/environment.ts';
const renderer = new THREE.WebGLRenderer({antialias:true, preserveDrawingBuffer:true});
renderer.setSize(innerWidth, innerHeight); renderer.setPixelRatio(devicePixelRatio);
configureRenderer(renderer); document.body.append(renderer.domElement);
const scene = new THREE.Scene();
const env = new Environment(scene, {envIntensity:0.65}, renderer);
const camera = new THREE.PerspectiveCamera(33,innerWidth/innerHeight,0.01,20);
camera.position.set(0,0.12,Math.max(2.35,3.2/camera.aspect)); camera.lookAt(0,0.015,0);
const texture = roundBerryTexture(), geometry = roundBerryGeometry(), knotGeometry = roundBerryKnot();
const leafMaterial = berryCapMaterial();
const knotMaterial = new THREE.MeshStandardMaterial({color:0x78633d,roughness:0.85});
const groups=[], glows=[];
for (const [i, radius] of [0.12,0.18,0.24].entries()) {
  const group = new THREE.Group(); group.position.x=(i-1)*0.5;
  const {material,glow} = roundBerryMaterial(texture,1701+i*7.31); material.attenuationDistance=radius*4.8; glows.push(glow);
  const {width,depth} = berryFullness(1701,i);
  const fruit = new THREE.Mesh(geometry, material); fruit.scale.set(radius*width,radius,radius*depth);
  const cap = new THREE.Mesh(berryCapGeometry(1701,i,radius),leafMaterial); cap.scale.copy(fruit.scale);
  const knot = new THREE.Mesh(knotGeometry,knotMaterial); knot.scale.setScalar(0.013); knot.position.y=radius;
  const stemCurve = new THREE.CubicBezierCurve3(
    new THREE.Vector3(0,radius+STALK_KNOT_HEIGHT*0.8,0),
    new THREE.Vector3(0,radius+0.13,0),
    new THREE.Vector3(-0.065,radius+0.22,-0.015),
    new THREE.Vector3(-0.045,radius+0.32,-0.035));
  const stemGeometry = new THREE.TubeGeometry(stemCurve,16,1,8,false);
  const stemPositions = stemGeometry.getAttribute('position');
  for (let row=0; row<=16; row++) {
    const centre = stemCurve.getPointAt(row/16);
    const radiusAt = berryStalkRadius(1-row/16);
    for (let col=0; col<=8; col++) {
      const index=row*9+col;
      const point = new THREE.Vector3().fromBufferAttribute(stemPositions,index).sub(centre).multiplyScalar(radiusAt).add(centre);
      stemPositions.setXYZ(index,point.x,point.y,point.z);
    }
  }
  stemGeometry.computeVertexNormals();
  const stem = new THREE.Mesh(stemGeometry,knotMaterial);
  group.add(fruit,cap,knot,stem); scene.add(group); groups.push(group);
  const behind = new THREE.Mesh(new THREE.CylinderGeometry(0.008,0.008,0.65,12),
    new THREE.MeshStandardMaterial({color:0x8ca577,roughness:0.8}));
  behind.position.set(group.position.x+0.035,0,-0.3); behind.rotation.z=-0.4; scene.add(behind);
}
const backlight = new THREE.DirectionalLight(0xffe0a6,0); backlight.position.set(0,0.5,-2); scene.add(backlight);
function lighting(sun,fill,background,back) {
  env.sun.intensity=sun; scene.environmentIntensity=fill; scene.background=new THREE.Color(background); backlight.intensity=back;
}
document.querySelector('#day').onclick=()=>lighting(3.1,0.65,0x1f2430,0);
document.querySelector('#cave').onclick=()=>lighting(0,0.08,0x101a19,0);
document.querySelector('#back').onclick=()=>lighting(0.3,0.22,0x263631,6);
document.querySelector('#glow').oninput=e=>glows.forEach(g=>g.value=Number(e.target.value)/1.5);
document.querySelector('#turn').oninput=e=>groups.forEach(g=>g.rotation.y=Number(e.target.value));
document.querySelector('#front').onclick=()=>groups.forEach(g=>g.rotation.set(0,0,0));
document.querySelector('#side').onclick=()=>groups.forEach(g=>g.rotation.set(0,Math.PI/2,0));
document.querySelector('#below').onclick=()=>groups.forEach(g=>g.rotation.set(-1.15,0,0));
document.querySelector('#above').onclick=()=>groups.forEach(g=>g.rotation.set(1.15,0,0));
renderer.setAnimationLoop(()=>renderer.render(scene,camera));
</script>
</html>
